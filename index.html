<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>踅夜市</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #fcfdfd;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            margin: 0;
        }

        .city-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 300px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-card:hover {
            transform: translateY(-5px);
            border-color: #a3b18a; /* 溫暖的草綠色邊框回饋 */
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .city-card:active {
            transform: scale(0.97);
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
    </style>
</head>
<body>

<script>
    // 嚴格對照您上傳的檔案名稱進行配對
    const assets = [
        { img: "p2_1.jpg",  snd: "s2_1.mp3" },  // 雲林
        { img: "p2_2.jpg",  snd: "s2_2.mp3" },  // 嘉義市
        { img: "p2_3.jpg",  snd: "s2_3.mp3" },  // 嘉義縣
        { img: "p2_4.jpg",  snd: "s2_4.mp3" },  // 台南
        { img: "p2_5.jpg",  snd: "s2_5.mp3" },  // 高雄
        { img: "p2_6.jpg",  snd: "s2_6.mp3" },  // 屏東
        { img: "p2_7.jpg",  snd: "s2_7.mp3" },  // 澎湖
        { img: "p2_8.jpg",  snd: "s2_8.mp3" },  // 花蓮
        { img: "p2_9.jpg",  snd: "s2_9.mp3" },  // 台東
        { img: "p2_10.jpg", snd: "s2_10.mp3" }, // 馬祖
            ];

    assets.forEach(item => {
        const div = document.createElement('div');
        div.className = 'city-card';
        div.onclick = () => playAudio(item.snd);
        
        const img = document.createElement('img');
        img.src = item.img;
        
        div.appendChild(img);
        document.body.appendChild(div);
    });

    let currentAudio = null;

    function playAudio(fileName) {
        // 如果有正在播放的聲音，先停止並重置
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        
        currentAudio = new Audio(fileName);
        currentAudio.play().catch(err => {
            console.error("播放失敗，請檢查檔案是否存在於同路徑下：" + fileName);
        });
    }
</script>

</body>
</html>
